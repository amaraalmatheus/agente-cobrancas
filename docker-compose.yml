services:
  db:
    image: postgres:17
    container_name: cobrancas-db
    environment:
      POSTGRES_USER: cobrancas
      POSTGRES_PASSWORD: cobrancas
      POSTGRES_DB: cobrancas
    ports:
      - "5433:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data   # os dados sobrevivem quando o container para

volumes:
  dados_postgres:
